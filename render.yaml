services:
  - type: web
    name: smarthire-backend
    env: node
    plan: free
    buildCommand: pnpm install --prod=false && pnpm build --filter=server
    startCommand: cd apps/server && pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: NODE_VERSION
        value: 22.x
